services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-second_brain}
      POSTGRES_USER: ${POSTGRES_USER:-sb_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sb_owner_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - sb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sb_owner} -d ${POSTGRES_DB:-second_brain}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sb_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-sb_minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sb_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./db:/app/db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    command: celery -A app.jobs.celery_app worker --beat --loglevel=info
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./api:/app
      - ./db:/app/db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    command: npm run dev -- -H 0.0.0.0
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - sb_frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  sb_postgres_data:
  sb_minio_data:
  sb_frontend_node_modules:
